; Configuración de PHP para la mini-API (la lee PHP-FPM/CGI por carpeta;
; si el hosting corriera mod_php, este archivo simplemente se ignora).
;
; Los avisos de PHP NUNCA deben imprimirse aquí: esta carpeta solo responde JSON.
; Un aviso de arranque —por ejemplo un POST que se pasa de post_max_size— se
; escribe antes que cualquier código nuestro, rompe el JSON de la respuesta,
; filtra rutas internas del servidor e impide fijar el código HTTP correcto.
display_errors = Off
display_startup_errors = Off
log_errors = On
